  {id:48,year:2023,region:'Global',cat:'E',title:"Global sustainable bond issuance breaches $1 trillion again",source:"IFC / World Bank",date:"2023",summary:"Global green, social, sustainability and sustainability-linked bond issuance exceeded $1 trillion in 2023, matching the 2021 record, with emerging market green bonds up 34% year-on-year to $135 billion.",why:"Showed the sustainable debt market rebounding from a 2022 dip despite anti-ESG headwinds, confirming structural demand from institutional investors.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:49,year:2024,region:'Global',cat:'E',title:"Lifetime green bond issuance crosses $3 trillion",source:"Climate Bonds Initiative",date:"Q1 2024",summary:"Cumulative aligned green bond issuance crossed the $3 trillion mark in Q1 2024, with quarterly issuance hitting a new record of $195.9 billion. Sovereign issuance surpassed $500 billion from 53 countries.",why:"Demonstrated that green bonds have become mainstream fixed income, not a niche — relevant for Malaysian issuers benchmarking their own green/blue sukuk programmes.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:50,year:2025,region:'Global',cat:'E',title:"Global sustainable debt hits $6 trillion milestone",source:"Climate Bonds Initiative",date:"Jul 2025",summary:"Total aligned green, social, sustainability and sustainability-linked bonds crossed $6 trillion issued since market inception, growing from just $2 billion 15 years ago, with trillions in annual issuance forecast before 2030.",why:"The sustainable debt market is now a multi-trillion dollar asset class reshaping how capital flows to climate and social projects globally.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},

  // ===== MORE CORPORATE & GEOPOLITICAL =====
  {id:51,year:2022,region:'Global',cat:'E',title:"US passes Inflation Reduction Act — $369 billion for clean energy",source:"US Congress",date:"Aug 2022",summary:"The US passed the Inflation Reduction Act, the largest climate spending package in US history, allocating $369 billion in clean energy tax credits, EV incentives and domestic manufacturing subsidies.",why:"Reshaped global clean energy investment flows and created new competitive dynamics for ASEAN manufacturers in EV batteries, solar and semiconductors.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:52,year:2022,region:'Global',cat:'S',title:"EU reaches agreement on Corporate Sustainability Due Diligence Directive (CSDDD) principles",source:"European Council",date:"Dec 2022",summary:"The European Council accepted a set of CSDDD proposals requiring EU companies to identify, prevent and address human rights and environmental impacts across their value chains, though financial institutions were initially excluded.",why:"Extended ESG liability from disclosure to operational accountability, with extraterritorial reach affecting Malaysian companies in EU supply chains.",link:"",impact:"Raises expectations for human rights and labour due diligence across global value chains — relevant to supplier codes of conduct and audit programmes."},
  {id:53,year:2023,region:'MY',cat:'S',title:"Malaysia ESG Skills Readiness: graduates struggle with social risk assessment",source:"The Edge Malaysia",date:"2023",summary:"Early findings from the Malaysia ESG Skills Readiness study highlighted that graduates consistently struggle with human rights due diligence, supply chain integrity and stakeholder engagement in practice.",why:"Social-pillar competencies are the weakest link in Malaysia's ESG talent pipeline, relevant to building internal capacity at companies like Axiata.",link:"",impact:"Raises due-diligence and supply chain audit expectations for Malaysian companies — relevant to vendor onboarding and labour rights policies."},
  {id:54,year:2024,region:'Global',cat:'E',title:"EU reaches political agreement on nature restoration law",source:"European Council",date:"Jun 2024",summary:"EU ministers narrowly approved the Nature Restoration Law, requiring member states to restore at least 20% of the EU's land and sea areas by 2030 and all degraded ecosystems by 2050.",why:"Extends EU environmental regulation beyond climate into biodiversity, creating new compliance expectations for companies with EU-facing supply chains.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:55,year:2023,region:'MY',cat:'E',title:"Malaysia's palm oil sector achieves near-100% MSPO certification",source:"MPOB / Government of Malaysia",date:"2023",summary:"Malaysia achieved near-full coverage of mandatory Malaysian Sustainable Palm Oil (MSPO) certification across plantations, mills and supply chains, positioning the sector for EUDR compliance.",why:"A critical preparedness milestone ahead of EUDR enforcement, demonstrating that 'sustainable by law' can be a viable compliance strategy for commodity exporters.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:56,year:2024,region:'MY',cat:'E',title:"EU-Malaysia joint statement: MSPO to meet EUDR requirements",source:"EU / Malaysia Joint Task Force",date:"May 2024",summary:"The EU Commissioner and Malaysia's Minister of Plantation and Commodities agreed that MSPO certification provides readiness and assurances under the EUDR, with the EU pledging €110 million to support smallholders.",why:"De-risked Malaysia's palm oil trade with the EU and validated the country's national certification approach as a model for other commodity-producing nations.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:57,year:2025,region:'Global',cat:'R',title:"EU Omnibus cuts ESRS mandatory data points by up to 89%",source:"EFRAG / European Commission",date:"Jun 2025",summary:"The EFRAG update under the Omnibus Simplification Package reduced mandatory ESRS data points by 89% for financial institutions and 64% for non-financial companies, simplified double materiality assessment, and enhanced interoperability with ISSB.",why:"A dramatic scale-back of EU reporting ambition, signalling that even the most pro-ESG jurisdiction is prioritising 'less but better' disclosure over maximalist data capture.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:58,year:2026,region:'MY',cat:'E',title:"LSS6 large-scale solar round opens with ~2GW capacity",source:"Government of Malaysia",date:"2026",summary:"Malaysia's sixth Large-Scale Solar procurement round (LSS6) opened with nearly 2GW of capacity and an estimated RM6 billion in private investment, continuing the momentum from fully-subscribed LSS5 and LSS5+ rounds.",why:"Directly advances NETR renewable energy targets and creates new investment opportunities in Malaysia's solar ecosystem.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:59,year:2026,region:'Global',cat:'E',title:"Carbon pricing covers 29% of global emissions, revenues hit record $107 billion",source:"World Bank / Carbon Credits",date:"May 2026",summary:"The World Bank's 2026 carbon pricing report found 87 carbon pricing instruments (47 taxes, 40 ETSs) now cover 29% of global GHG emissions. Revenues reached $107 billion in 2025, with average carbon prices doubling from $10/tonne in 2016 to $21/tonne in 2026. Five new national systems launched including India's CCTS and Japan's GX-ETS.",why:"Carbon pricing is now a $100B+ annual fiscal instrument globally, directly relevant to Malaysia's new carbon tax design and the competitive landscape across ASEAN.",link:"https://carboncredits.com/carbon-pricing-covers-29-of-global-emissions-and-hits-record-107-billion-in-revenues/",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:60,year:2026,region:'Global',cat:'E',title:"India launches Carbon Credit Trading Scheme (CCTS) covering 7 sectors",source:"World Bank / India Government",date:"2026",summary:"India launched its Carbon Credit Trading Scheme covering 7 sectors, 490 industries and approximately 477 million tonnes of CO2e, making it one of the world's largest new carbon pricing systems.",why:"India's entry into carbon pricing reshapes the ASEAN-South Asia competitive landscape and creates new market dynamics for carbon credit trading in the region.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:61,year:2026,region:'Global',cat:'E',title:"Japan launches GX-ETS covering 50%+ of national emissions",source:"World Bank / Japan Government",date:"2026",summary:"Japan's Green Transformation Emissions Trading System (GX-ETS) went live covering over 700 companies and more than 50% of national emissions (~524 million tonnes CO2e), as part of its broader GX Strategy.",why:"Another major Asian economy building carbon market infrastructure, adding momentum to the regional shift toward compliance carbon markets that Malaysia's own system will need to interoperate with.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},

  // ===== THE EDGE MALAYSIA — CORPORATE-RELEVANT =====
  {id:62,year:2024,region:'MY',cat:'R',title:"Bursa launches Centralised Sustainability Intelligence (CSI) platform",source:"The Edge Malaysia",date:"21 Jun 2024",summary:"Bursa Malaysia launched the CSI Solution, developed with the London Stock Exchange Group, enabling companies of all sizes to measure, estimate and disclose carbon emissions on a single platform aligned with ISSB standards. Financial institutions offered special funding rates for companies using it.",why:"Gives Malaysian PLCs and SMEs a practical tool for ISSB-aligned emissions disclosure, and links ESG data quality directly to access to cheaper capital.",link:"https://theedgemalaysia.com/node/716274",impact:"Adds to mandatory reporting scope and compliance timeline for Malaysian PLCs — relevant for reporting calendar, data collection systems and assurance planning."},
  {id:63,year:2023,region:'MY',cat:'E',title:"Bank Negara and Bursa launch supply chain ESG programmes for SMEs",source:"The Edge Malaysia",date:"Jun 2023",summary:"Bank Negara's Greening Value Chain (GVC) programme and Bursa's Early Adopter Programme (EAP) launched to help PLCs bring their SME suppliers up to ESG reporting standard, with companies like Kossan Rubber paying for software access for their vendors.",why:"ESG compliance is cascading from PLCs into supply chains — SME suppliers that can't report emissions risk losing contracts, making this directly relevant to Axiata's own vendor ecosystem.",link:"https://theedgemalaysia.com/node/671340",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:64,year:2023,region:'MY',cat:'E',title:"Malaysian manufacturers face imminent CBAM and carbon tax pressure",source:"The Edge Malaysia",date:"Dec 2023",summary:"MITI launched the i-ESG framework and KenalESG outreach clinics to help manufacturers begin sustainability journeys, as the EU CBAM transitional phase started in October 2023 and Malaysia's carbon tax approached.",why:"The manufacturing sector is Malaysia's third-largest emission source, and the CBAM-carbon tax pincer creates real cost exposure for exporters of iron, steel, cement and aluminium.",link:"https://theedgemalaysia.com/node/694969",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:65,year:2025,region:'MY',cat:'R',title:"AI meets ESG: Carbon GPT integrates with Bursa's CSI platform",source:"The Edge Malaysia",date:"May 2025",summary:"Malaysian AI startup Carbon GPT partnered with Bursa Malaysia to integrate AI-powered carbon accounting and report generation into the CSI platform, automating emissions calculation and methodology documentation for carbon tax declarations.",why:"Shows the intersection of AI and ESG reporting that sustainability teams should monitor — automated emissions reporting tools will reshape how compliance work gets done.",link:"https://theedgemalaysia.com/node/754590",impact:"Adds to mandatory reporting scope and compliance timeline for Malaysian PLCs — relevant for reporting calendar, data collection systems and assurance planning."},
  {id:66,year:2022,region:'MY',cat:'E',title:"Bursa Malaysia launches Voluntary Carbon Market (VCM)",source:"The Edge Malaysia / Bursa",date:"Dec 2022",summary:"Bursa Malaysia launched its Voluntary Carbon Market exchange, providing a regulated platform for companies to buy and sell carbon credits to offset emissions, as a precursor to Malaysia's broader carbon pricing architecture.",why:"Created domestic carbon market infrastructure ahead of the mandatory carbon tax, giving Malaysian companies a mechanism to trade credits and prepare for compliance carbon pricing.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:67,year:2026,region:'MY',cat:'R',title:"Bursa: over 130 large-cap PLCs now reporting under NSRF with IFRS S1/S2",source:"The Edge Malaysia",date:"Apr 2026",summary:"More than 130 large-cap Malaysian PLCs are actively reporting under the NSRF aligned with IFRS S1 and S2, with the rest of the Main Market following in 2026 and large non-listed companies joining by 2027. Malaysia leads the world in green sukuk issuance.",why:"Confirms Malaysia's ESG reporting regime is operational and expanding — not just policy announcements but actual compliance at scale, with green finance leadership as a competitive differentiator.",link:"https://theedgemalaysia.com/node/800506",impact:"Adds to mandatory reporting scope and compliance timeline for Malaysian PLCs — relevant for reporting calendar, data collection systems and assurance planning."},

  // ===== CLIMATE DISASTERS =====
  {id:68,year:2022,region:'MY',cat:'D',title:"Malaysia's worst floods in decades: 54 dead, RM6.1 billion in losses",source:"DOSM / Reuters",date:"Dec 2021 – Jan 2022",summary:"Record rainfall of 316.5mm in 24 hours in Klang triggered catastrophic flooding across 11 states. 54 people killed, ~400,000 evacuated, 16,000+ homes damaged. Economic losses: RM6.1 billion (~US$1.5 billion), equivalent to 0.4% of GDP. Described by officials as a 'once-every-100-years' event.",why:"Malaysia's worst climate-related disaster in modern history, exposing systemic weaknesses in flood response and accelerating calls for climate adaptation investment and better urban planning.",link:"",impact:"Signals physical climate risk exposure for Malaysian operations, assets and supply chains — relevant for climate risk disclosure and business continuity planning."},
  {id:69,year:2022,region:'Global',cat:'D',title:"Pakistan mega-floods: 1,760 dead, $30–40 billion in damage",source:"World Bank / UNDP",date:"Jun – Oct 2022",summary:"Record monsoon rains (up to 500% above 30-year average) inundated one-third of Pakistan. 1,760 killed, 12,867 injured, 33 million affected, 2 million homes destroyed, 8 million displaced. Economic losses: $30–40 billion (2.2% of GDP). Climate scientists found global warming increased rainfall intensity by ~50%.",why:"The definitive case study for climate loss and damage — a country contributing just 0.3% of global emissions suffering $40 billion in climate-amplified flooding, catalysing the COP27 Loss and Damage Fund agreement.",link:"",impact:"Underscores physical climate risk to global operations and supply chains — relevant for climate scenario analysis and TCFD/ISSB-aligned risk disclosures."},
  {id:70,year:2022,region:'Global',cat:'D',title:"Europe's deadliest heatwave: ~70,000 heat-related deaths, €40 billion in damage",source:"Lancet / ISGlobal / Copernicus",date:"Jun – Sep 2022",summary:"Persistent heatwaves across Europe from June to September, peaking at 47.0°C in Portugal. Estimated 61,672–70,000+ heat-related deaths across the continent. €40 billion in economic damage. Triggered record drought, wildfires and crop failures across Mediterranean and Western Europe.",why:"Demonstrated that extreme heat is now a mass-casualty event in wealthy countries, not just developing ones — reshaping corporate risk assessment for physical climate impacts.",link:"",impact:"Underscores physical climate risk to global operations and supply chains — relevant for climate scenario analysis and TCFD/ISSB-aligned risk disclosures."},
  {id:71,year:2022,region:'Global',cat:'D',title:"China's worst heatwave in recorded history: 50,900 estimated deaths, $7.6 billion damage",source:"Wikipedia / Chinese Meteorological Administration",date:"Jun – Aug 2022",summary:"China experienced its most severe heatwave on record, lasting 79 days with temperatures reaching 45.0°C. Estimated 50,900 heat-related deaths. $7.6 billion in economic damage. Major rivers dried up, hydropower collapsed, and factories shut across Sichuan and Chongqing provinces.",why:"Disrupted global supply chains when Chinese factories and hydropower shut down, showing how physical climate risk translates directly into manufacturing and trade disruption for ASEAN economies.",link:"",impact:"Underscores physical climate risk to global operations and supply chains — relevant for climate scenario analysis and TCFD/ISSB-aligned risk disclosures."},
  {id:72,year:2023,region:'Global',cat:'D',title:"Libya floods: 4,000–11,000+ dead in Derna after dam collapse",source:"WHO / World Bank / ReliefWeb",date:"11 Sep 2023",summary:"Storm Daniel (a medicane) hit eastern Libya, dumping 414mm of rain in 24 hours and bursting two dams above Derna. 4,000–11,000+ killed (up to 20% of Derna's population), 44,000 displaced, 18,500+ homes destroyed. Reconstruction needs estimated at $1.8 billion. A quarter of Derna was completely destroyed.",why:"Illustrated how aging infrastructure + climate extremes + governance failures create catastrophic cascading risks — a stark warning for developing countries with deferred maintenance on critical infrastructure.",link:"",impact:"Underscores physical climate risk to global operations and supply chains — relevant for climate scenario analysis and TCFD/ISSB-aligned risk disclosures."},
  {id:73,year:2023,region:'Global',cat:'D',title:"2023 confirmed as hottest year on record at +1.48°C above pre-industrial",source:"Copernicus / WMO",date:"2023",summary:"2023 was confirmed as the warmest year on record globally, at 0.60°C above the 1991–2020 average and ~1.48°C above pre-industrial levels. Nearly 50% of days exceeded 1.5°C warming. Two days exceeded 2.0°C for the first time ever. European heat-related deaths estimated at 47,000+.",why:"Pushed the world to the brink of the 1.5°C Paris threshold, making climate risk a present-tense corporate issue rather than a future scenario.",link:"",impact:"Underscores physical climate risk to global operations and supply chains — relevant for climate scenario analysis and TCFD/ISSB-aligned risk disclosures."},
  {id:74,year:2023,region:'Global',cat:'D',title:"European heatwaves kill 47,000+ across the continent",source:"Nature Medicine / ISGlobal",date:"Jun – Sep 2023",summary:"Europe's 'Cerberus' heatwave reached a record 47.8°C in Sicily, Italy. Over 47,000 heat-related deaths estimated across the continent — Italy (10,000), France (9,500), Spain (7,500), Germany (3,450), UK (2,400). Heat-related mortality has increased 30% in the last 20 years across Europe.",why:"Three consecutive years of mass heat mortality in Europe (2022: ~70,000, 2023: 47,000, 2024: 62,700) makes heat risk an unavoidable factor in corporate climate risk assessment and adaptation planning.",link:"",impact:"Underscores physical climate risk to global operations and supply chains — relevant for climate scenario analysis and TCFD/ISSB-aligned risk disclosures."},
  {id:75,year:2024,region:'Global',cat:'D',title:"2024 European heatwaves: 62,700+ heat-related deaths",source:"Nature Medicine / Copernicus",date:"Jun – Aug 2024",summary:"Heatwaves across Southern and Southeast Europe broke regional records, peaking at 46.8°C in Cyprus. Over 62,700 heat-related deaths estimated across Europe. Valencia, Spain, experienced catastrophic flash floods in autumn killing 200+.",why:"Third consecutive year of record heat mortality in Europe, cementing extreme heat as a structural risk to economies, healthcare systems and workforce productivity — not a one-off anomaly.",link:"",impact:"Underscores physical climate risk to global operations and supply chains — relevant for climate scenario analysis and TCFD/ISSB-aligned risk disclosures."},
  {id:76,year:2025,region:'Global',cat:'D',title:"2025 European heatwaves: 16,500+ estimated deaths, earliest records broken",source:"Wikipedia / National weather agencies",date:"Apr – Sep 2025",summary:"Record-breaking temperatures arrived as early as April. June temperatures exceeded 46°C in both Portugal and Spain, breaking national records. Estimated 16,500+ heat-related deaths. Scientists found ~68% of heatwave deaths were attributable to climate change. Spain declared its hottest summer on record.",why:"Heat-related deaths now a recurring annual mass casualty event in Europe, with attribution science directly linking outcomes to climate change — relevant for corporate climate scenario analysis.",link:"",impact:"Underscores physical climate risk to global operations and supply chains — relevant for climate scenario analysis and TCFD/ISSB-aligned risk disclosures."},
  {id:77,year:2024,region:'MY',cat:'D',title:"2024–2025 Southeast Asia floods: 1,200+ dead, $3.5 billion+ in damage",source:"Wikipedia / ReliefWeb",date:"Nov 2024 – early 2025",summary:"La Niña-exacerbated monsoon flooding hit Southeast and South Asia in multiple waves. 1,200+ fatalities region-wide, millions displaced. In Malaysia, flooding displaced 148,000+ across 10 states in the first wave alone (Dec 2024). Sri Lanka among the most severely affected nations.",why:"Recurring regional flooding pattern directly affecting ASEAN economies and supply chains, reinforcing the need for corporate climate adaptation planning across the region.",link:"",impact:"Signals physical climate risk exposure for Malaysian operations, assets and supply chains — relevant for climate risk disclosure and business continuity planning."},

  // ===== AI & ESG =====
  {id:78,year:2024,region:'Global',cat:'A',title:"Big Tech spent $200 billion+ on AI infrastructure; became 43% of all clean energy PPAs",source:"Brookings / BloombergNEF",date:"2024",summary:"Amazon, Microsoft, Google and Meta collectively spent over $200 billion on capex in 2024 (62% YoY increase), mostly on AI data centres. Big Tech accounted for 43% of all global clean energy power purchase agreements. PPA prices rose 35% due to this surge in procurement.",why:"AI-driven energy demand is now the single largest driver of corporate renewable energy procurement globally, reshaping power markets and creating both opportunities and risks for grid capacity.",link:"",impact:"Signals where global energy markets and grid capacity are headed as AI scales — relevant for any company relying on data infrastructure or facing rising energy costs."},
  {id:79,year:2024,region:'Global',cat:'A',title:"Microsoft signs 20-year deal to restart Three Mile Island nuclear plant for AI",source:"Microsoft / Constellation Energy",date:"Sep 2024",summary:"Microsoft signed a landmark 20-year agreement with Constellation Energy to restart the 835 MW Unit 1 of the Three Mile Island nuclear plant in Pennsylvania, exclusively to power its AI data centres.",why:"Signals that Big Tech is willing to invest in nuclear — not just renewables — to meet AI's baseload power demands, opening a new chapter in the relationship between tech companies and energy systems.",link:"",impact:"Signals where global energy markets and grid capacity are headed as AI scales — relevant for any company relying on data infrastructure or facing rising energy costs."},
  {id:80,year:2025,region:'Global',cat:'A',title:"Global data centre investment hits $580 billion; AI projected to consume 945 TWh/year by 2030",source:"IEA / TTMS / McKinsey",date:"2025",summary:"An estimated $580 billion was spent on AI-focused data centre infrastructure in 2025 alone. Data centres consumed ~1.5% of global electricity in 2024, projected to double to 945 TWh by 2030 — exceeding Japan's total electricity consumption. AI workloads expected to account for 50%+ of all data centre power by 2028.",why:"The scale of AI's energy footprint is now a systemic ESG issue — it's one of the few sectors where emissions are still growing, creating tension with corporate net-zero commitments.",link:"",impact:"Signals where global energy markets and grid capacity are headed as AI scales — relevant for any company relying on data infrastructure or facing rising energy costs."},
  {id:81,year:2025,region:'Global',cat:'A',title:"Amazon, Meta, Google, Microsoft account for 49% of all global clean energy PPAs",source:"BloombergNEF / ESG Today",date:"2025",summary:"The four hyperscalers accounted for 49% of all global clean power purchase agreement volumes in 2025 (55.9 GW total). Despite a 10% overall market decline (the first in 8 years), North America grew slightly, while APAC volumes dropped 36%.",why:"Big Tech's dominance of the clean energy PPA market is crowding out other corporate buyers, with implications for energy costs and renewable energy availability for non-tech companies including in ASEAN.",link:"https://www.esgtoday.com/amazon-meta-google-microsoft-account-for-half-of-global-clean-energy-purchase-deals-in-2025-report/",impact:"Signals where global energy markets and grid capacity are headed as AI scales — relevant for any company relying on data infrastructure or facing rising energy costs."},
  {id:82,year:2025,region:'Global',cat:'A',title:"Tech giants commit $10 billion+ to nuclear partnerships for AI power",source:"Multiple sources",date:"2025",summary:"Amazon invested $500 million in X-energy, Google contracted 1.8 GW from Elementl Power, and Microsoft's Three Mile Island restart progressed. Combined Big Tech nuclear commitments exceeded $10 billion, with 22 GW of nuclear projects now in development globally for data centre power.",why:"The nuclear-AI convergence represents a fundamental shift in how Big Tech approaches energy — from intermittent renewables to firm baseload power, with major implications for energy transition narratives.",link:"",impact:"Signals where global energy markets and grid capacity are headed as AI scales — relevant for any company relying on data infrastructure or facing rising energy costs."},
  {id:83,year:2026,region:'Global',cat:'A',title:"Google reports 37% electricity demand increase; supply chain emissions up 25%",source:"Google 2026 Environmental Report / Il Sole 24 Ore",date:"Jul 2026",summary:"Google reported a 37% increase in electricity demand for 2025 — the largest annual increase in its history — driven by AI infrastructure expansion. Operational emissions fell 2% (via clean energy purchases), but supply chain (Scope 3) emissions rose 25% from server/chip production. Google has contracted 12+ GW of clean energy.",why:"Proves that AI infrastructure scaling is outpacing decarbonisation of grids — even for companies at the frontier of clean energy procurement, Scope 3 from hardware production is a growing blind spot.",link:"",impact:"Signals where global energy markets and grid capacity are headed as AI scales — relevant for any company relying on data infrastructure or facing rising energy costs."},
  {id:84,year:2026,region:'Global',cat:'A',title:"NTT Data and ENGIE partner to decarbonise global data centre operations",source:"NTT DATA / AI Magazine / ESG Today",date:"29 Jul 2026",summary:"NTT Data and ENGIE announced a strategic partnership to secure long-term renewable energy access and power solutions for NTT Data's global data centre operations, combining ENGIE's RE portfolio with NTT's infrastructure to support net-zero ambitions while scaling AI capacity.",why:"Shows how data centre operators are now structuring long-term energy partnerships (not just PPAs) to lock in decarbonisation at scale — a model that telcos and other infrastructure companies could follow.",link:"https://www.esgtoday.com/ntt-data-engie-launch-clean-energy-partnership-to-decarbonize-global-data-center-footprint/",impact:"Signals where global energy markets and grid capacity are headed as AI scales — relevant for any company relying on data infrastructure or facing rising energy costs."},
  {id:85,year:2026,region:'Global',cat:'A',title:"Amazon, Google, Meta and Microsoft launch Data Centre Innovation Initiative",source:"ESG Dive / Elemental Impact",date:"May 2026",summary:"The four hyperscalers launched a joint Data Centre Innovation Initiative backed by Elemental Impact and Breakthrough Energy, investing $500K–$5M per project in up to 10 startups developing next-generation energy and materials technology for sustainable data centres through 2027.",why:"The first coordinated Big Tech effort to jointly invest in solving AI's sustainability problem — signals that the industry recognises the ESG risk is systemic, not just company-specific.",link:"https://www.esgdive.com/news/data-center-innovation-initiative-launched-meta-microsoft-google-amazon-technology-investments/821508/",impact:"Signals where global energy markets and grid capacity are headed as AI scales — relevant for any company relying on data infrastructure or facing rising energy costs."},

  // ===== GREENWASHING & ENFORCEMENT =====
  {id:86,year:2022,region:'Global',cat:'G',title:"German police raid DWS and Deutsche Bank HQ over greenwashing allegations",source:"Reuters / Euronews",date:"May 2022",summary:"German prosecutors raided DWS and parent Deutsche Bank's headquarters after a whistleblower alleged the asset manager marketed funds as greener than they actually were. DWS CEO Asoka Woehrmann subsequently resigned.",why:"The first-ever police raid on a major financial institution over ESG misrepresentation, setting a precedent that greenwashing carries criminal-investigation-level enforcement risk.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:87,year:2023,region:'Global',cat:'G',title:"DWS pays $25 million SEC fine for ESG misstatements",source:"Reuters / SEC",date:"Sep 2023",summary:"Deutsche Bank's DWS paid $25 million to settle SEC charges over misstatements regarding its ESG investment process and AML failures. The SEC found DWS marketed itself as an ESG leader but failed to implement the policies it promoted to investors from 2018 to 2021.",why:"The largest SEC greenwashing fine at the time, establishing that overstating ESG credentials in fund marketing has real financial and regulatory consequences.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:88,year:2023,region:'Global',cat:'R',title:"California becomes first US state to mandate corporate climate disclosure",source:"California Legislature / Proskauer",date:"Oct 2023",summary:"Governor Newsom signed SB 253 (requiring GHG emissions reporting for companies with $1B+ revenue doing business in California) and SB 261 (requiring climate-related financial risk disclosure for $500M+ revenue companies), covering ~4,100 companies.",why:"California's economy is the world's 5th largest — these laws create a de facto US national standard, affecting thousands of companies including those with no California HQ but significant California revenue.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:89,year:2026,region:'Global',cat:'G',title:"US CEOs deprioritise sustainability amid political pressure",source:"ESG Dive / Conference Board",date:"Feb 2026",summary:"A Conference Board survey found US CEOs are more likely to deprioritise sustainability in 2026 under the Trump administration, shifting to 'selective and economically grounded' ESG initiatives focused on cost efficiency, operational resilience and supply chain stability rather than broad ESG commitments.",why:"Captures the real-world corporate response to political anti-ESG pressure — companies aren't abandoning sustainability entirely but are reframing it as operational resilience rather than values-driven ESG.",link:"https://www.esgdive.com/news/us-ceos-dialing-back-on-sustainability-in-2026-conference-board/812593/",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:90,year:2026,region:'Global',cat:'R',title:"Singapore releases proposed ISSB-aligned sustainability reporting standards",source:"ESG Today / Singapore MAS",date:"Jul 2026",summary:"Singapore released its proposed ISSB-aligned sustainability reporting standards for public consultation, with listed companies to report Scope 1 and 2 from 2025 and Scope 3 from 2026, and large non-listed companies following from 2027.",why:"Singapore joining the ISSB adoption wave alongside Malaysia — the two ASEAN financial centres are now converging on common disclosure standards, improving cross-border comparability for investors.",link:"https://www.esgtoday.com/singapore-releases-proposed-issb-aligned-sustainability-reporting-standards/",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:91,year:2026,region:'Global',cat:'E',title:"Singapore and World Bank launch Carbon Markets Program",source:"ESG Today / NCCS",date:"May 2026",summary:"Singapore's National Climate Change Secretariat and the World Bank launched the Singapore Carbon Markets Program to support developing countries in building and scaling national carbon markets, addressing key barriers to carbon market growth.",why:"Positions Singapore as a regional hub for carbon market development and Article 6 implementation — directly relevant as Malaysia develops its own carbon market architecture.",link:"https://www.esgtoday.com/singapore-world-bank-partner-to-scale-national-carbon-markets/",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:92,year:2026,region:'Global',cat:'G',title:"Net Zero Financial Service Providers Alliance disbands",source:"ESG Today",date:"2026",summary:"The Net Zero Financial Service Providers Alliance — a coalition of financial advisory and service firms committed to supporting the net-zero transition — formally disbanded, joining NZAM and other voluntary climate alliances that have dissolved under political and legal pressure.",why:"Part of a broader unravelling of voluntary net-zero coalitions, raising questions about whether collective climate commitments by financial institutions are politically sustainable in the current environment.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:93,year:2026,region:'Global',cat:'R',title:"EU companies continue CSRD reporting despite Omnibus rollbacks",source:"ESG Dive",date:"2026",summary:"Despite the EU's Omnibus Simplification Package reducing CSRD scope and delaying Wave 2/3 deadlines, a significant number of EU companies are continuing with sustainability reporting preparations, viewing it as inevitable and strategically valuable regardless of regulatory timing.",why:"Shows that corporate momentum on ESG reporting can survive regulatory pullbacks — companies that have invested in reporting infrastructure aren't stopping just because deadlines shifted.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:94,year:2025,region:'Global',cat:'R',title:"California identifies 4,100+ companies subject to mandatory climate disclosure",source:"CARB / ESG sources",date:"Sep 2025",summary:"The California Air Resources Board released a preliminary list of approximately 4,100 companies subject to the state's mandatory GHG emissions disclosure requirements under SB 253, covering public and private companies doing business in California with $1B+ revenue.",why:"Made concrete what was previously theoretical — thousands of companies now know they're in scope for California's climate disclosure laws, including many with no prior ESG reporting obligations.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:95,year:2026,region:'Global',cat:'E',title:"Transition bond issuance forecast to double in 2026",source:"Moody's / ESG Today",date:"2026",summary:"Moody's projected that transition bond issuance would double in 2026, as companies in hard-to-abate sectors increasingly use transition-labelled instruments to finance decarbonisation pathways that don't qualify under strict green bond frameworks.",why:"Transition finance is becoming the fastest-growing segment of sustainable debt — critical for carbon-intensive industries (including energy and heavy manufacturing) that need capital for gradual decarbonisation.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},

  // ===== GFANZ & NET-ZERO ALLIANCES COLLAPSE =====
  {id:96,year:2025,region:'Global',cat:'G',title:"All six major US banks exit Net-Zero Banking Alliance ahead of Trump inauguration",source:"Reuters / Trellis / ESG Today",date:"Jan 2025",summary:"JPMorgan Chase, Bank of America, Citi, Goldman Sachs, Wells Fargo and Morgan Stanley all exited the UN-backed Net-Zero Banking Alliance within weeks of each other in late 2024/early 2025, ahead of Trump's inauguration. Combined assets of exiting banks exceeded $14 trillion. GFANZ subsequently restructured, dropping the requirement for members to belong to a net-zero coalition.",why:"The most dramatic unravelling of voluntary climate finance commitments in history — calls into question whether collective net-zero alliances are politically sustainable, and forces a rethink of how climate finance is governed.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:97,year:2024,region:'Global',cat:'G',title:"Net-Zero Insurance Alliance disbands after majority of founding members withdraw",source:"Bloomberg / Responsible Investor",date:"2024",summary:"The Net-Zero Insurance Alliance, launched at COP26 with founding members including AXA, Allianz and Munich Re, formally disbanded in 2024 after most of its founding members withdrew under pressure from US Republican attorneys general who framed climate alliances as anticompetitive collusion.",why:"The first major GFANZ sub-alliance to completely collapse, foreshadowing the NZBA bank exodus that followed — demonstrated that US political pressure could unwind global voluntary climate commitments.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},

  // ===== CLIMATE LITIGATION LANDMARKS =====
  {id:98,year:2021,region:'Global',cat:'G',title:"Dutch court orders Shell to cut emissions 45% by 2030 — first corporate Scope 3 ruling",source:"FT / Reuters / Responsible Investor",date:"May 2021",summary:"The Hague District Court ordered Shell to reduce its net CO2 emissions by 45% by 2030 (vs 2019 levels), including Scope 3, in the Milieudefensie v Shell case. It was the first time any court in the world ordered a company to cut its value-chain emissions.",why:"Set the global precedent for holding fossil fuel companies legally accountable for Scope 3 emissions, spawning dozens of copycat cases worldwide and fundamentally changing the risk calculus for corporate climate commitments.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:99,year:2024,region:'Global',cat:'G',title:"Dutch appeals court overturns Shell emissions order but affirms corporate duty of care",source:"Reuters / Shell / Linklaters",date:"Nov 2024",summary:"The Hague Court of Appeal overturned Shell's specific 45% reduction order, finding insufficient scientific consensus for applying a specific percentage to one company. However, the court affirmed that companies like Shell have a duty of care to reduce emissions, including Scope 3 — leaving the legal principle intact.",why:"A Pyrrhic victory for Shell: the specific order is gone but the underlying legal duty survived, meaning future cases can build on the 'duty of care' principle with better-calibrated demands.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:100,year:2024,region:'Global',cat:'G',title:"UK Supreme Court rules Scope 3 emissions must be assessed in environmental impact reviews (Finch v Surrey)",source:"FT / Bloomberg / ESG Dive",date:"Jun 2024",summary:"The UK Supreme Court ruled in Finch v Surrey County Council that planning authorities must consider downstream Scope 3 GHG emissions when assessing the environmental impact of fossil fuel projects — the first Supreme Court-level ruling requiring Scope 3 assessment.",why:"Established at the highest UK court level that Scope 3 emissions are a material consideration in project approvals, with immediate follow-on litigation blocking North Sea oil field consents.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:101,year:2025,region:'Global',cat:'G',title:"Paris court finds TotalEnergies guilty of greenwashing — first major oil company ruling",source:"Columbia Climate Law / Greenpeace / ClientEarth",date:"Oct 2025",summary:"The Paris Judicial Tribunal ruled that TotalEnergies engaged in misleading environmental advertising by claiming to be 'a major player in the energy transition' and promoting a '2050 carbon neutrality ambition' while continuing to expand fossil fuel production. First court ruling holding a major oil company accountable for greenwashing its climate strategy.",why:"Demonstrates that European courts are willing to hold major corporates accountable for the gap between climate marketing and actual business strategy — directly relevant to any company making net-zero claims.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},

  // ===== SBTi CONTROVERSY & STANDARDS EVOLUTION =====
  {id:102,year:2024,region:'Global',cat:'R',title:"SBTi board sparks crisis by proposing carbon offsets for Scope 3 targets",source:"FT Moral Money / Responsible Investor / NewClimate Institute",date:"Apr 2024",summary:"The SBTi Board of Trustees unilaterally announced plans to allow carbon credits for Scope 3 emissions abatement, triggering internal staff revolt, mass criticism from climate scientists, and pushback from major companies including H&M. Staff accused the board of bypassing due process under pressure from business groups with carbon market interests.",why:"Threatened to undermine the credibility of the world's most widely used corporate climate target-setting framework (9,700+ validated companies). The controversy was later effectively reversed in the V2.0 draft, but damaged trust in SBTi governance.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:103,year:2025,region:'Global',cat:'R',title:"GHG Protocol begins Scope 2 and Scope 3 standard revisions — final updates pushed to 2027",source:"Trellis / GreenBiz / GHG Protocol",date:"2025",summary:"The GHG Protocol initiated formal revision of its Scope 2 and Scope 3 standards, with a controversial Scope 2 revision around 'consequential' accounting methods opening for public consultation in late 2025. Final revisions pushed to 2027, meaning companies face 2+ years of methodological uncertainty.",why:"The GHG Protocol is the foundation for virtually all corporate emissions accounting. Changes to Scope 2 and 3 methodology will reshape how every company worldwide calculates and reports its emissions — including under ISSB, CSRD and NSRF.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:104,year:2025,region:'Global',cat:'G',title:"ESG shareholder proposals decline but remain resilient despite US anti-ESG pressure",source:"Harvard Law / As You Sow / ISS",date:"Jun 2025",summary:"324 environmental and social shareholder proposals were filed in the 2025 US proxy season (down from ~460 in 2024). Climate risk (85 proposals), political spending (77), and environmental management (52) were top themes. 79% of targeted companies had received similar proposals in the prior 5 years, showing persistent investor focus.",why:"Despite the anti-ESG narrative, institutional investors are still actively using shareholder proposals as an engagement tool — the decline is in volume, not in strategic targeting of laggards.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."}
];

let activeYear = 'all', activeRegion = 'all', activeCat = 'all', searchTerm = '';
let marks = {};

const yearlyHighlights = {

function renderHighlights(){
  const body = document.getElementById('highlights-body');
  const years = Object.keys(yearlyHighlights).sort((a,b)=>b-a);
  body.innerHTML = years.map(y=>{
    const count = items.filter(i=>i.year==y).length;
    const points = yearlyHighlights[y].map(p=>`<li>${p}</li>`).join('');
    return `<div class="year-block">
      <div class="year-heading">${y} <span class="year-count">${count} stories</span></div>
      <ul class="year-highlights">${points}</ul>
    </div>`;
  }).join('');
}

document.getElementById('highlights-toggle').addEventListener('click', ()=>{
  const b = document.getElementById('highlights-body');
  const c = document.getElementById('highlights-chevron');
  b.classList.toggle('open');
  c.classList.toggle('open');
});

function renderStats(){
  const visible = getFiltered();
  const my = visible.filter(i=>i.region==='MY').length;
  const gl = visible.filter(i=>i.region==='Global').length;
  const e = visible.filter(i=>i.cat==='E').length;
  const s = visible.filter(i=>i.cat==='S').length;
  const g = visible.filter(i=>i.cat==='G').length;
  const curated = Object.values(marks).filter(Boolean).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Showing</div><div class="stat-value">${visible.length}</div></div>
    <div class="stat"><div class="stat-label">Malaysia</div><div class="stat-value">${my}</div></div>
    <div class="stat"><div class="stat-label">Global</div><div class="stat-value">${gl}</div></div>
    <div class="stat"><div class="stat-label">Curated</div><div class="stat-value" style="color:var(--green-text);">${curated}</div></div>
  `;
}

function makeFilters(){
  const years = [2022,2023,2024,2025,2026];
  document.getElementById('year-filters').innerHTML =
    `<button class="fbtn active" data-v="all">All</button>` +
    years.map(y=>`<button class="fbtn" data-v="${y}">${y}</button>`).join('');
  document.getElementById('region-filters').innerHTML =
    `<button class="fbtn active" data-v="all">All</button>
     <button class="fbtn" data-v="MY"><i class="ti ti-map-pin" style="font-size:14px;vertical-align:-2px;margin-right:3px;" aria-hidden="true"></i>Malaysia</button>
     <button class="fbtn" data-v="Global"><i class="ti ti-world" style="font-size:14px;vertical-align:-2px;margin-right:3px;" aria-hidden="true"></i>Global</button>`;
  document.getElementById('cat-filters').innerHTML =
    `<button class="fbtn active" data-v="all">All</button>
     <button class="fbtn" data-v="E"><i class="ti ti-leaf" style="font-size:14px;vertical-align:-2px;margin-right:3px;" aria-hidden="true"></i>Environmental</button>
     <button class="fbtn" data-v="S"><i class="ti ti-users" style="font-size:14px;vertical-align:-2px;margin-right:3px;" aria-hidden="true"></i>Social</button>
     <button class="fbtn" data-v="G"><i class="ti ti-gavel" style="font-size:14px;vertical-align:-2px;margin-right:3px;" aria-hidden="true"></i>Governance</button>
     <button class="fbtn" data-v="R"><i class="ti ti-report" style="font-size:14px;vertical-align:-2px;margin-right:3px;" aria-hidden="true"></i>ESG reporting</button>
     <button class="fbtn" data-v="D"><i class="ti ti-alert-triangle" style="font-size:14px;vertical-align:-2px;margin-right:3px;" aria-hidden="true"></i>Climate disaster</button>
     <button class="fbtn" data-v="A"><i class="ti ti-cpu" style="font-size:14px;vertical-align:-2px;margin-right:3px;" aria-hidden="true"></i>AI &amp; ESG</button>`;

  document.getElementById('year-filters').addEventListener('click', e=>{
    if(!e.target.classList.contains('fbtn')) return;
    activeYear = e.target.dataset.v;
    document.querySelectorAll('#year-filters .fbtn').forEach(b=>b.classList.toggle('active', b===e.target));
    render();
  });
  document.getElementById('region-filters').addEventListener('click', e=>{
    if(!e.target.closest('.fbtn')) return;
    const btn = e.target.closest('.fbtn');
    activeRegion = btn.dataset.v;
    document.querySelectorAll('#region-filters .fbtn').forEach(b=>b.classList.toggle('active', b===btn));
    render();
  });
  document.getElementById('cat-filters').addEventListener('click', e=>{
    if(!e.target.closest('.fbtn')) return;
    const btn = e.target.closest('.fbtn');
    activeCat = btn.dataset.v;
    document.querySelectorAll('#cat-filters .fbtn').forEach(b=>b.classList.toggle('active', b===btn));
    render();
  });
  document.getElementById('search').addEventListener('input', e=>{
    searchTerm = e.target.value.toLowerCase();
    render();
  });
}

function getFiltered(){
  return items.filter(i=>{
    if(activeYear!=='all' && i.year!=activeYear) return false;
    if(activeRegion!=='all' && i.region!==activeRegion) return false;
    if(activeCat!=='all' && i.cat!==activeCat) return false;
    if(searchTerm && !i.title.toLowerCase().includes(searchTerm) && !i.summary.toLowerCase().includes(searchTerm)) return false;
    return true;
  });
}

function render(){
  renderStats();
  const filtered = getFiltered();
  document.getElementById('count').textContent = `${filtered.length} stories`;

  const el = document.getElementById('cards');
  if(!filtered.length){ el.innerHTML = '<div class="empty">No stories match these filters.</div>'; return; }

  el.innerHTML = filtered.map(i=>{
    const catLabels = {E:'Environmental',S:'Social',G:'Governance',R:'ESG reporting',D:'Climate disaster',A:'AI & ESG'};
    const checked = marks[i.id] ? 'checked' : '';
    const linkHtml = i.link ? `<p style="margin-top:6px;"><a href="${i.link}" target="_blank" rel="noopener noreferrer">Read source <i class="ti ti-external-link" style="font-size:12px;vertical-align:-1px;" aria-hidden="true"></i></a></p>` : `<p style="margin-top:6px;font-size:12px;color:var(--text-3);font-style:italic;">No source link available for this story</p>`;
    const titleHtml = i.link ? `<a href="${i.link}" target="_blank" rel="noopener noreferrer">${i.title}</a>` : i.title;
    const sourceHtml = i.link ? `<a href="${i.link}" target="_blank" rel="noopener noreferrer" class="source-link">${i.source} <i class="ti ti-external-link" style="font-size:11px;vertical-align:-1px;" aria-hidden="true"></i></a>` : i.source;
    const catColors = {E:'#34D399',S:'#F472B6',G:'#A78BFA',R:'#38BDF8',D:'#FB7185',A:'#818CF8'};
    return `<div class="card" style="--catclr:${catColors[i.cat]}">
      <div class="card-head">
        <div style="flex:1;">
          <div class="card-meta">
            <span class="pill pill-${i.cat}">${catLabels[i.cat]}</span>
            <span class="pill pill-year">${i.year}</span>
            <span class="meta-text">${i.region==='MY'?'Malaysia':'Global'}</span>
            <span class="meta-text">&middot; ${i.date}</span>
            <span class="meta-text">&middot; ${sourceHtml}</span>
          </div>
          <div class="card-title">${titleHtml}</div>
          <div class="card-summary">${i.summary}</div>
          <details>
            <summary>Why it matters</summary>
            <p>${i.why}</p>
            ${linkHtml}
          </details>
          <details>
            <summary>Impact to corporates</summary>
            <p>${i.impact}</p>
          </details>
        </div>
        <label class="cb-label">
          <input type="checkbox" data-id="${i.id}" ${checked}>
          <span>Add</span>
        </label>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      marks[e.target.dataset.id] = e.target.checked;
      try { localStorage.setItem('esg-repo-marks', JSON.stringify(marks)); } catch(err){}
      renderStats();
    });
  });
}

function exportRepo(){
  const curated = items.filter(i=>marks[i.id]);
  if(!curated.length){ alert('No stories selected yet. Tick the checkbox on stories you want in your repository.'); return; }
  const catLabels = {E:'Environmental',S:'Social',G:'Governance'};
  let md = '# Curated ESG News Repository\n\nExported: ' + new Date().toLocaleDateString() + '\n\n';
  ['E','S','G','R','D','A'].forEach(cat=>{
    const inCat = curated.filter(i=>i.cat===cat);
    if(!inCat.length) return;
    md += `## ${catLabels[cat]}\n\n`;
    inCat.sort((a,b)=>b.year-a.year).forEach(i=>{
      md += `### ${i.title}\n`;
      md += `**${i.year}** | ${i.region==='MY'?'Malaysia':'Global'} | ${i.source} | ${i.date}\n\n`;
      md += `${i.summary}\n\n`;
      md += `*Why it matters:* ${i.why}\n\n`;
      md += `*Impact to corporates:* ${i.impact}\n\n`;
      if(i.link) md += `[Source](${i.link})\n\n`;
      md += '---\n\n';
    });
  });
  const blob = new Blob([md], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ESG-News-Repository.md';
  a.click();
}

// Init
try { const saved = localStorage.getItem('esg-repo-marks'); if(saved) marks = JSON.parse(saved); } catch(err){}
makeFilters();
render();
renderHighlights();
</script>
