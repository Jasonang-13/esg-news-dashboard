<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG News Repository</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --bg: #060811; --surface: rgba(18,23,41,0.72); --surface-solid: #111528; --card-hover: rgba(24,30,52,0.85);
  --border: rgba(148,163,196,0.14); --border-strong: rgba(148,163,196,0.28);
  --text-1: #EAEEF9; --text-2: #94A0C2; --text-3: #57608A;
  --accent: #2DD4E8; --accent-soft: rgba(45,212,232,0.12); --accent-glow: rgba(45,212,232,0.45);
  --violet: #A78BFA; --violet-soft: rgba(167,139,250,0.12);
  --green: #34D399; --green-soft: rgba(52,211,153,0.12);
  --pink: #F472B6; --pink-soft: rgba(244,114,182,0.12);
  --blue: #38BDF8; --blue-soft: rgba(56,189,248,0.12);
  --rose: #FB7185; --rose-soft: rgba(251,113,133,0.14);
  --indigo: #818CF8; --indigo-soft: rgba(129,140,248,0.12);
  --amber: #FBBF24; --amber-soft: rgba(251,191,36,0.12);
  --radius: 10px; --radius-lg: 14px;
  --font: 'Inter', -apple-system, sans-serif;
  --font-display: 'Space Grotesk', 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: var(--accent-glow); color: #06111A; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(148,163,196,0.25); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: rgba(148,163,196,0.4); }

body {
  font-family: var(--font); background: var(--bg); color: var(--text-1); line-height: 1.6;
  padding: 32px 24px 60px; max-width: 920px; margin: 0 auto; position: relative;
  background-image:
    radial-gradient(circle at 12% -10%, rgba(45,212,232,0.14), transparent 42%),
    radial-gradient(circle at 100% 15%, rgba(167,139,250,0.12), transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(52,211,153,0.06), transparent 45%),
    repeating-linear-gradient(0deg, rgba(148,163,196,0.035) 0px, rgba(148,163,196,0.035) 1px, transparent 1px, transparent 48px),
    repeating-linear-gradient(90deg, rgba(148,163,196,0.035) 0px, rgba(148,163,196,0.035) 1px, transparent 1px, transparent 48px);
  background-attachment: fixed;
}

/* ===== Header ===== */
.hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 10px; }
.hdr-title { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.hdr-title .icon-badge { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--accent-soft), var(--violet-soft)); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 22px var(--accent-glow); }
.hdr-title .icon-badge i { font-size: 19px; background: linear-gradient(135deg, var(--accent), var(--violet)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hdr-title .grad-text { background: linear-gradient(90deg, #F4F7FF 20%, var(--accent) 65%, var(--violet) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.live-badge { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--green); background: var(--green-soft); border: 1px solid rgba(52,211,153,0.3); padding: 5px 11px; border-radius: 20px; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(0.75); } }
.subtitle { font-size: 13.5px; color: var(--text-3); margin-bottom: 26px; font-family: var(--font-mono); letter-spacing: 0.01em; }
.subtitle .sep { color: var(--text-3); opacity: 0.5; margin: 0 2px; }

/* ===== Stats ===== */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 15px 17px; position: relative; overflow: hidden; transition: border-color 0.2s, transform 0.2s; }
.stat:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.stat-label { font-size: 11px; color: var(--text-3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-mono); }
.stat-value { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }

/* ===== Highlights (briefing panel) ===== */
.highlights-section { margin-bottom: 22px; }
.highlights-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 14px 18px; background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: var(--radius-lg); transition: border-color 0.2s, background 0.2s; }
.highlights-toggle:hover { border-color: rgba(167,139,250,0.4); background: var(--card-hover); }
.highlights-toggle-title { font-size: 14px; font-weight: 600; font-family: var(--font-display); display: flex; align-items: center; gap: 10px; color: var(--text-1); }
.highlights-toggle-title i { color: var(--violet); font-size: 17px; }
.chevron { transition: transform 0.2s; color: var(--text-3); }
.chevron.open { transform: rotate(180deg); }
.highlights-body { display: none; padding: 18px 20px 6px; margin-top: 8px; background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--border); border-left: 2px solid var(--violet); border-radius: var(--radius-lg); }
.highlights-body.open { display: block; animation: fadeSlide 0.25s ease; }
.year-block { margin-bottom: 20px; }
.year-block:last-child { margin-bottom: 4px; }
.year-heading { font-family: var(--font-mono); font-size: 15px; font-weight: 600; margin-bottom: 9px; display: flex; align-items: center; gap: 10px; color: var(--accent); }
.year-count { font-size: 10.5px; font-weight: 500; color: var(--text-3); background: rgba(148,163,196,0.08); border: 1px solid var(--border); border-radius: 20px; padding: 2px 9px; font-family: var(--font); }
.year-highlights { margin: 0; padding-left: 0; list-style: none; }
.year-highlights li { font-size: 13px; color: var(--text-2); line-height: 1.7; margin-bottom: 7px; padding-left: 16px; position: relative; }
.year-highlights li::before { content: ''; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }

/* ===== Filters ===== */
.filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 9px; }
.filter-row label { font-size: 11px; color: var(--text-3); font-weight: 600; min-width: 52px; padding-top: 6px; text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-mono); }
.filters { display: flex; gap: 7px; flex-wrap: wrap; }
.fbtn { font-size: 12.5px; padding: 6px 13px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--text-2); cursor: pointer; font-family: var(--font); font-weight: 500; transition: all 0.15s; backdrop-filter: blur(10px); }
.fbtn:hover { border-color: var(--border-strong); color: var(--text-1); }
.fbtn.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(45,212,232,0.4); box-shadow: 0 0 14px rgba(45,212,232,0.15); }

.search-box { width: 100%; padding: 11px 16px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; background: var(--surface); backdrop-filter: blur(10px); color: var(--text-1); font-family: var(--font); margin: 4px 0 18px; transition: border-color 0.2s, box-shadow 0.2s; }
.search-box::placeholder { color: var(--text-3); }
.search-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,212,232,0.12); }

/* ===== Toolbar ===== */
.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
.toolbar .count { font-size: 12.5px; color: var(--text-3); font-family: var(--font-mono); }
.export-btn { font-size: 12.5px; padding: 8px 16px; border: 1px solid rgba(52,211,153,0.35); border-radius: 20px; background: var(--green-soft); color: var(--green); cursor: pointer; font-family: var(--font); font-weight: 600; transition: all 0.15s; }
.export-btn:hover { background: rgba(52,211,153,0.2); box-shadow: 0 0 16px rgba(52,211,153,0.2); }

/* ===== Cards ===== */
.card-list { display: flex; flex-direction: column; gap: 11px; }
.card { background: var(--surface); backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 17px 20px 17px 22px; position: relative; overflow: hidden; transition: border-color 0.2s, transform 0.15s, background 0.2s; animation: fadeSlide 0.3s ease; }
.card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--catclr, var(--accent)); box-shadow: 0 0 12px var(--catclr, var(--accent)); }
.card:hover { border-color: var(--border-strong); background: var(--card-hover); }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 7px; }
.pill { font-size: 10.5px; padding: 3px 9px; border-radius: 20px; font-weight: 600; font-family: var(--font-mono); letter-spacing: 0.02em; border: 1px solid transparent; }
.pill-E { background: var(--green-soft); color: var(--green); border-color: rgba(52,211,153,0.25); }
.pill-S { background: var(--pink-soft); color: var(--pink); border-color: rgba(244,114,182,0.25); }
.pill-G { background: var(--violet-soft); color: var(--violet); border-color: rgba(167,139,250,0.25); }
.pill-R { background: var(--blue-soft); color: var(--blue); border-color: rgba(56,189,248,0.25); }
.pill-D { background: var(--rose-soft); color: var(--rose); border-color: rgba(251,113,133,0.3); }
.pill-A { background: var(--indigo-soft); color: var(--indigo); border-color: rgba(129,140,248,0.25); }
.pill-year { background: rgba(148,163,196,0.08); color: var(--text-2); border-color: var(--border); font-family: var(--font-mono); }
.meta-text { font-size: 11.5px; color: var(--text-3); font-family: var(--font-mono); }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; line-height: 1.45; font-family: var(--font-display); color: var(--text-1); }
.card-title a { color: inherit; text-decoration: none; }
.card-title a:hover { color: var(--accent); }
.source-link { color: var(--text-3); text-decoration: none; }
.source-link:hover { color: var(--accent); }
.card-summary { font-size: 13px; color: var(--text-2); line-height: 1.65; }
details { margin-top: 9px; }
details + details { margin-top: 5px; }
details summary { font-size: 12.5px; color: var(--accent); cursor: pointer; font-weight: 500; list-style: none; display: flex; align-items: center; gap: 5px; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: '▸'; font-size: 10px; transition: transform 0.15s; }
details[open] summary::before { transform: rotate(90deg); }
details summary:hover { color: #5EEAFA; }
details p { font-size: 13px; color: var(--text-2); margin-top: 7px; line-height: 1.65; padding-left: 15px; border-left: 1.5px solid var(--border); }
details a { color: var(--accent); font-size: 12px; text-decoration: none; }
details a:hover { text-decoration: underline; }

.cb-label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; cursor: pointer; flex-shrink: 0; font-family: var(--font-mono); }
.cb-label input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }

.empty { font-size: 14px; color: var(--text-3); padding: 40px 0; text-align: center; font-family: var(--font-mono); }
</style>
</head>
<body>

<div class="hdr">

    <span class="icon-badge"><i class="ti ti-plant-2" aria-hidden="true"></i></span>

</div>
<p class="subtitle">2022 <span class="sep">&rarr;</span> 2026 <span class="sep">&middot;</span> Malaysia &amp; Global <span class="sep">&middot;</span> tick stories to curate your repository</p>

    </span>

<div class="toolbar">
  <span class="count" id="count"></span>
  <button class="export-btn" id="export-btn" onclick="exportRepo()"><i class="ti ti-download" style="font-size:14px;vertical-align:-2px;margin-right:4px;" aria-hidden="true"></i>Export curated list</button>
</div>

<div class="card-list" id="cards"></div>

<script>
const items = [
  // ===== 2026-08-02 WEEKLY UPDATE =====
  {id:105,year:2026,region:'Global',cat:'E',title:"EU unveils electrification plan to cut fossil fuel reliance",source:"Treasurers.org, ESG Update",date:"Jul 2026",summary:"The EU announced a new electrification push aimed at reducing the bloc's dependence on imported fossil fuels, featured as a policy highlight in the July 2026 ESG Update roundup.",why:"Signals continued EU commitment to reducing fossil fuel dependence via electrification of demand, ahead of firmer sector targets and timelines.",link:"https://www.treasurers.org/esg-update-july-2026",impact:"Relevant for companies with EU energy exposure — electrification mandates typically flow into capex and procurement planning for heating, transport and industrial processes."},
  {id:106,year:2026,region:'Global',cat:'E',title:"Airbus & Air Canada launch ~C$13.7M Sustainability Co-Investment Platform for Canadian SAF",source:"Airbus Newsroom / ESG Today",date:"Jul 2026",summary:"Airbus and Air Canada announced a roughly C$13.7 million co-investment platform at the Farnborough Airshow to scale domestic Canadian sustainable aviation fuel (SAF) production.",why:"A concrete capital commitment to build out SAF supply in a market that currently has little domestic production, addressing a key bottleneck in aviation decarbonisation.",link:"https://www.esgtoday.com/airbus-air-canada-launch-sustainable-aviation-fuel-investment-platform/",impact:"Relevant for aviation and travel-dependent corporates tracking SAF supply and pricing as a lever for Scope 3 business-travel emissions."},
  {id:107,year:2026,region:'Global',cat:'S',title:"UK proposes new deforestation-linked supply chain regulation",source:"ESG Today",date:"Jul 2026",summary:"The UK government announced plans for new supply chain regulation covering deforestation-linked commodities, mirroring the core commodity list of the EU's Deforestation Regulation (EUDR).",why:"Signals continued UK-EU alignment on forest-risk commodity sourcing, reducing the chance of diverging compliance regimes for multinational supply chains.",link:"",impact:"Companies sourcing cattle, cocoa, palm oil, soy, coffee, rubber or timber-linked products into the UK should start tracking scope and timelines alongside existing EUDR compliance work."},
  {id:108,year:2026,region:'Global',cat:'R',title:"ESMA, EBA, EIOPA propose EU Taxonomy disclosure simplification",source:"ESMA / ESG Today / CSSF",date:"Jul 2026",summary:"The EU's three financial regulators jointly proposed measures to simplify the EU Taxonomy disclosure framework, following a public hearing held 22 Jul 2026; the consultation runs through 12 Aug 2026.",why:"Part of the broader EU 'Omnibus' simplification trend — could meaningfully reduce the disclosure burden for financial institutions currently navigating Taxonomy-aligned reporting.",link:"https://www.esma.europa.eu/press-news/esma-news/esma-consults-simplifying-eu-taxonomy-disclosure-framework",impact:"Financial institutions and large corporates with EU Taxonomy exposure should monitor the consultation outcome before locking in 2026/2027 disclosure processes."},
  {id:109,year:2026,region:'Global',cat:'D',title:"Europe's 2026 heatwave season becomes most destructive on record",source:"Envisionation / Wikipedia",date:"Jul 2026",summary:"Europe's 2026 heatwave season is being described as the most destructive on record: roughly 10,440 deaths as of mid-July (about 9,800 in Germany alone), over 1.2 million hectares burned across the EU, and economic losses estimated at approximately €126 billion.",why:"The scale of mortality and economic loss makes 2026 a landmark year for physical climate risk in Europe, likely to influence insurance pricing, adaptation policy and corporate resilience planning.",link:"https://envisionation.org/blog/10440-dead-eur126bn-in-damages-the-human-and-economic-price-of-europes-2026-heatwave-crisis/",impact:"Relevant for insurers, real estate, agriculture and any EU-exposed operations — expect rising adaptation capex and insurance costs flowing from this year's toll."},
  {id:110,year:2026,region:'Global',cat:'A',title:"Aalo Atomics & Crusoe Energy announce nuclear-AI data center partnership",source:"POWER Magazine",date:"30 Jul 2026",summary:"Aalo Atomics and Crusoe Energy announced a commercial partnership under which Aalo will power a Crusoe Spark modular data center at Idaho National Laboratory as a 2027 proof-of-concept, with plans to deploy 50-MWe Aalo Pods at Crusoe data centers by end of 2029.",why:"Adds to a fast-growing wave of hyperscaler and AI-infrastructure nuclear deals (13+ deals, ~10GW combined) — nuclear is emerging as the preferred long-term power source for AI data center load growth.",link:"https://www.powermag.com/aalo-crusoe-plan-2027-inl-demonstration-pairing-nuclear-power-and-ai-data-center-load/",impact:"Relevant for any company benchmarking AI infrastructure energy strategy or evaluating nuclear PPAs as part of its own decarbonisation/energy security planning."},

  // ===== 2022 =====
  {id:1,year:2022,region:'MY',cat:'R',title:"Bursa Malaysia enhances sustainability reporting requirements",source:"Bursa Malaysia",date:"Sep 2022",summary:"Bursa Malaysia updated its Main Market and ACE Market listing requirements to include enhanced sustainability reporting, mandating common ESG disclosures on anti-corruption, energy management and data privacy for all PLCs.",why:"The foundational regulatory shift that moved Malaysia from voluntary to structured ESG disclosure, setting the stage for ISSB alignment later.",link:"",impact:"Adds to mandatory reporting scope and compliance timeline for Malaysian PLCs — relevant for reporting calendar, data collection systems and assurance planning."},
  {id:2,year:2022,region:'MY',cat:'E',title:"SC introduces SRI-linked sukuk framework",source:"Securities Commission",date:"Jun 2022",summary:"The Securities Commission Malaysia launched the SRI-linked Sukuk Framework, enabling companies to raise funds linked to sustainability performance targets, expanding beyond use-of-proceeds instruments.",why:"Opened a new class of transition financing for Malaysian companies, enabling sustainability-linked fundraising beyond just 'green' projects.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:3,year:2022,region:'MY',cat:'E',title:"Malaysia commits to 45% carbon intensity reduction at COP26 follow-up",source:"MOF / Climate diplomacy",date:"2022",summary:"Malaysia reaffirmed its COP26 pledge to cut carbon intensity by 45% by 2030 relative to 2005 levels, and confirmed net zero GHG emissions aspiration by 2050.",why:"Anchored Malaysia's national climate target, driving downstream policy (NETR, carbon tax) and corporate disclosure expectations.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:4,year:2022,region:'MY',cat:'E',title:"PETRONAS allocates 20% of capex to decarbonisation (2022–2026)",source:"PETRONAS",date:"2022",summary:"PETRONAS announced its Net Zero Carbon Emissions 2050 pathway and committed 20% of capital expenditure from 2022 to 2026 for decarbonisation projects and cleaner energy expansion.",why:"Malaysia's largest company signalling serious capital allocation to energy transition, influencing the broader GLC and energy ecosystem.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:5,year:2022,region:'Global',cat:'R',title:"EU adopts Corporate Sustainability Reporting Directive (CSRD)",source:"European Commission",date:"Nov 2022",summary:"The European Commission formally adopted the CSRD, replacing the Non-Financial Reporting Directive and mandating detailed sustainability disclosures under European Sustainability Reporting Standards for ~50,000 companies.",why:"The most sweeping mandatory ESG reporting regime globally, with extraterritorial reach affecting non-EU companies (including Malaysian ones) operating in EU supply chains.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:6,year:2022,region:'Global',cat:'E',title:"COP15 agrees Global Biodiversity Framework (Kunming-Montreal)",source:"UN CBD",date:"Dec 2022",summary:"Nearly 200 countries adopted the Kunming-Montreal Global Biodiversity Framework at COP15, setting 23 targets including requiring large companies to disclose biodiversity impacts by 2030.",why:"Put biodiversity on the corporate ESG agenda alongside climate, launching the TNFD framework that companies are now piloting.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},

  {id:8,year:2022,region:'MY',cat:'E',title:"Sarawak enacts carbon market legislation",source:"Sarawak Government",date:"2022",summary:"Sarawak passed the Land Code (Amendment) Bill and Forests (Amendment) Bill, empowering the state government to issue forest-carbon licences and regulate carbon-market activities.",why:"Made Sarawak the first Malaysian state with a legal framework for nature-based carbon projects, ahead of national carbon market policy.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},

  {id:9,year:2023,region:'Global',cat:'R',title:"ISSB issues final IFRS S1 and S2 standards",source:"IFRS Foundation",date:"26 Jun 2023",summary:"The ISSB published its inaugural standards — IFRS S1 (general sustainability disclosures) and IFRS S2 (climate disclosures) — endorsed by IOSCO, creating a global baseline for sustainability reporting.",why:"The single most consequential event for global ESG reporting: a unified standard that Malaysia, Japan, the UK and 20+ jurisdictions have since committed to adopt.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:10,year:2023,region:'MY',cat:'E',title:"Malaysia launches National Energy Transition Roadmap (NETR)",source:"Government of Malaysia",date:"27 Jul 2023",summary:"The Malaysian government launched NETR, targeting 70% renewable energy installed capacity by 2050, phasing out coal, and structuring 10 flagship projects across six energy transition levers including hydrogen, CCUS and green mobility.",why:"Malaysia's most comprehensive energy transition policy, estimating RM1.85 trillion in investment needs and reshaping the corporate sustainability landscape.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:11,year:2023,region:'MY',cat:'R',title:"Bursa Malaysia launches ESG Reporting Platform on Bursa LINK",source:"Bursa Malaysia",date:"Dec 2023",summary:"Bursa Malaysia launched a digital ESG reporting platform accessible through Bursa LINK at no cost, standardising sustainability data collection and enabling a prescribed performance data table for PLCs.",why:"Shifted ESG reporting from free-form annual report disclosures to structured digital submissions, improving comparability and data quality.",link:"",impact:"Adds to mandatory reporting scope and compliance timeline for Malaysian PLCs — relevant for reporting calendar, data collection systems and assurance planning."},
  {id:12,year:2023,region:'MY',cat:'E',title:"SRI sukuk issuance reaches RM27.6 billion",source:"Securities Commission",date:"2023",summary:"Malaysia's SRI sukuk issuance hit RM27.61 billion in 2023, up from RM10.58 billion in 2022, accounting for approximately 24% of total ASEAN SRI sukuk volume.",why:"A near-tripling in sustainable Islamic finance issuance, confirming Malaysia's position as the leading ASEAN market for green and sustainability-linked sukuk.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:13,year:2023,region:'Global',cat:'R',title:"Taskforce on Nature-related Financial Disclosures (TNFD) framework launched",source:"TNFD",date:"Sep 2023",summary:"The TNFD published its final framework for nature-related risk management and disclosure, modelled on TCFD, providing guidance for companies to assess and report biodiversity and ecosystem dependencies.",why:"Extended the corporate disclosure frontier beyond climate to nature, with companies beginning to pilot TNFD reporting by 2026.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:14,year:2023,region:'Global',cat:'E',title:"COP28 concludes with historic 'transitioning away from fossil fuels' agreement",source:"UNFCCC",date:"Dec 2023",summary:"COP28 in Dubai concluded with the first-ever explicit reference to transitioning away from fossil fuels in a COP decision text, alongside agreement to triple renewable energy capacity by 2030.",why:"Broke the political taboo on naming fossil fuels in UN climate text, signalling accelerated transition expectations for energy companies and sovereign policy.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:15,year:2023,region:'Global',cat:'R',title:"Nearly 400 organisations from 64 jurisdictions commit to ISSB adoption",source:"IFRS Foundation / COP28",date:"Dec 2023",summary:"At COP28, close to 400 organisations spanning companies, investors, stock exchanges and regulators from 64 jurisdictions committed to advancing the adoption of ISSB climate-related reporting.",why:"Demonstrated rapid global convergence around ISSB as the baseline, accelerating Malaysia's own NSRF development.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},

  // ===== 2024 =====
  {id:16,year:2024,region:'MY',cat:'R',title:"Malaysia launches National Sustainability Reporting Framework (NSRF)",source:"Securities Commission / MOF",date:"24 Sep 2024",summary:"The Ministry of Finance and Securities Commission Malaysia launched the NSRF, mandating IFRS S1 and S2 as baseline disclosure standards for PLCs and large non-listed companies, with phased implementation from 2025.",why:"Made Malaysia the first ASEAN jurisdiction to adopt ISSB standards with a limited transition, establishing a legally binding sustainability reporting regime.",link:"",impact:"Adds to mandatory reporting scope and compliance timeline for Malaysian PLCs — relevant for reporting calendar, data collection systems and assurance planning."},
  {id:17,year:2024,region:'MY',cat:'E',title:"Malaysia Budget 2025 announces carbon tax for iron, steel and energy",source:"Government of Malaysia",date:"Oct 2024",summary:"PM Anwar Ibrahim announced in Budget 2025 that Malaysia will introduce a carbon tax targeting the iron, steel and energy sectors, aligned with the national carbon market policy and upcoming climate change bill.",why:"Malaysia's first carbon pricing mechanism, directly linking to CBAM preparedness and signalling the start of a domestic carbon market.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:18,year:2024,region:'MY',cat:'E',title:"Malaysia launches Circular Economy Blueprint for Solid Waste (2025–2035)",source:"Government of Malaysia",date:"2024",summary:"Malaysia released a Circular Economy Blueprint including new Extended Producer Responsibility legislation and a 'zero-waste-to-landfill' certification for manufacturers.",why:"Extends the ESG agenda beyond emissions into waste and resource efficiency, creating new compliance requirements for manufacturing and FMCG sectors.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:19,year:2024,region:'MY',cat:'S',title:"Malaysia launches National Action Plan on Business & Human Rights (2025–2030)",source:"Government of Malaysia",date:"2024",summary:"Malaysia launched the NAPBHR 2025–2030, setting out expectations for corporate human rights due diligence, supply chain labour rights and alignment with UN Guiding Principles.",why:"Formalises the social pillar of ESG in Malaysian policy, directly relevant to forced labour allegations in plantation and electronics sectors.",link:"",impact:"Raises due-diligence and supply chain audit expectations for Malaysian companies — relevant to vendor onboarding and labour rights policies."},
  {id:20,year:2024,region:'Global',cat:'G',title:"EU finalises Corporate Sustainability Due Diligence Directive (CSDDD)",source:"European Council",date:"2024",summary:"The EU adopted the CSDDD, requiring large companies to conduct human rights and environmental due diligence across their value chains and present climate transition plans aligned with the Paris Agreement.",why:"Extends ESG liability beyond disclosure into operational due diligence, with extraterritorial reach affecting Malaysian companies in EU supply chains.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:21,year:2024,region:'Global',cat:'R',title:"SEC approves US climate disclosure rules (then faces legal challenge)",source:"SEC",date:"Mar 2024",summary:"The SEC approved sweeping climate disclosure rules for US public companies, requiring climate risk, governance and GHG emissions reporting. The rules immediately faced legal challenges from multiple states.",why:"Marked the US entry into mandatory climate disclosure, though subsequent political reversal under a new administration highlighted the global ESG policy divergence.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:22,year:2024,region:'MY',cat:'S',title:"US CBP WROs on Sime Darby and FGV over forced labour allegations",source:"US Customs and Border Protection",date:"2022–2024 ongoing",summary:"The US Customs and Border Protection maintained Withhold Release Orders against products from Sime Darby Plantations and FGV Holdings over forced labour allegations, blocking imports into the US market.",why:"The highest-profile social-pillar ESG enforcement action against Malaysian companies, with direct trade and reputational consequences.",link:"",impact:"Raises due-diligence and supply chain audit expectations for Malaysian companies — relevant to vendor onboarding and labour rights policies."},
  {id:23,year:2024,region:'MY',cat:'R',title:"Bursa Malaysia aligns Listing Requirements with NSRF and ISSB",source:"Bursa Malaysia",date:"Dec 2024",summary:"Bursa Malaysia amended Main Market and ACE Market Listing Requirements to align with the NSRF, making IFRS S1 and S2 compliance mandatory for PLCs from their respective implementation dates.",why:"Operationalised the NSRF into binding listing rules, moving from policy framework to enforceable regulatory requirement.",link:"",impact:"Adds to mandatory reporting scope and compliance timeline for Malaysian PLCs — relevant for reporting calendar, data collection systems and assurance planning."},

  // ===== 2025 =====
  {id:24,year:2025,region:'MY',cat:'R',title:"Large-cap Malaysian PLCs begin mandatory ISSB-aligned reporting",source:"Bursa Malaysia / SC",date:"Jan 2025",summary:"Main Market PLCs with market capitalisation above RM2 billion began mandatory sustainability reporting under IFRS S1 and S2, including climate-related governance, strategy, risk management and metrics disclosures.",why:"The first wave of mandatory ISSB reporting in Malaysia and ASEAN, setting the compliance benchmark for the rest of the market.",link:"",impact:"Adds to mandatory reporting scope and compliance timeline for Malaysian PLCs — relevant for reporting calendar, data collection systems and assurance planning."},
  {id:25,year:2025,region:'MY',cat:'E',title:"Solar ATAP programme replaces Net Energy Metering",source:"Government of Malaysia",date:"Dec 2025",summary:"Malaysia launched the Solar Accelerated Transition Action Programme (Solar ATAP), replacing the Net Energy Metering initiative, to boost distributed solar generation on building rooftops nationwide.",why:"Shifts Malaysia's rooftop solar policy from net metering to a potentially more scalable programme, expanding RE access for commercial and residential sectors.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:26,year:2025,region:'MY',cat:'S',title:"Malaysia ESG Skills Readiness Report reveals 15-point national skills gap",source:"The Edge Malaysia",date:"Feb 2025",summary:"A survey of 347 industry leaders identified an average 15-point national skills gap across 30 core sustainability competencies, with particular deficits in social risk assessment, human rights due diligence and climate data interpretation.",why:"Quantifies the talent bottleneck threatening Malaysia's sustainability transition, relevant to Axiata and other companies building internal ESG capacity.",link:"",impact:"Raises due-diligence and supply chain audit expectations for Malaysian companies — relevant to vendor onboarding and labour rights policies."},
  {id:27,year:2025,region:'Global',cat:'R',title:"EU adopts 'Stop-the-Clock' Directive, delaying CSRD and CSDDD",source:"European Parliament / Council",date:"Apr 2025",summary:"The EU formally adopted the Stop-the-Clock Directive, postponing CSRD reporting for Wave 2 and 3 companies by two years (to 2028) and delaying CSDDD transposition by one year, as part of the Omnibus Simplification Package.",why:"Major regulatory recalibration signalling that even the EU is pulling back on ESG implementation speed, with implications for how other jurisdictions pace their own mandates.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:28,year:2025,region:'Global',cat:'R',title:"EU Omnibus rejected then renegotiated — ESRS data points cut by up to 89%",source:"European Parliament / EFRAG",date:"Oct–Nov 2025",summary:"The European Parliament narrowly rejected the Omnibus Simplification Package (318-309), then renegotiated, resulting in agreement to cut mandatory ESRS data points by up to 89% for financial institutions and 64% for non-financial companies.",why:"Signals a fundamental shift in the EU's ESG reporting ambition — from maximalist disclosure to materiality-focused simplification.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:29,year:2025,region:'Global',cat:'R',title:"SEC stops defending US climate disclosure rule",source:"SEC",date:"2025",summary:"Under a new administration, the SEC voted to stop defending its own climate-risk disclosure rule adopted in March 2024, effectively signalling a regulatory retreat on mandatory climate reporting in the US.",why:"Deepens the US-EU policy divergence on ESG disclosure, creating a fragmented global landscape that multinational companies must navigate.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},
  {id:30,year:2025,region:'MY',cat:'E',title:"EUDR enters force for Malaysian palm oil, rubber and timber exports",source:"EU / Malaysia",date:"Dec 2025",summary:"The EU Deforestation Regulation took effect for large operators on 30 December 2025, requiring Malaysian exporters of palm oil, rubber and timber to demonstrate deforestation-free supply chains with plot-level geolocation data.",why:"Directly affects Malaysia's commodity export industries and triggers new traceability and compliance requirements across the plantation supply chain.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:31,year:2025,region:'MY',cat:'E',title:"PETRONAS advances CCS and hydrogen portfolio",source:"PETRONAS",date:"Late 2025",summary:"PETRONAS expanded its carbon capture and storage projects and strengthened hydrogen and renewable energy portfolios across Asia, accelerating emissions reduction aligned with its net-zero 2050 ambition.",why:"Demonstrates Malaysia's national energy company operationalising its transition strategy, creating demand signals for the broader OGSE ecosystem.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},

  // ===== 2026 =====
  {id:32,year:2026,region:'MY',cat:'E',title:"Air Selangor prices world's first blue sukuk (RM200m)",source:"BusinessToday",date:"29 Jul 2026",summary:"Air Selangor raised RM200 million via a blue sukuk — the first of its kind globally — to fund sustainable water infrastructure projects.",why:"A globally pioneering financing instrument out of Malaysia, creating a template for other GLCs and utilities to fund water and ocean-related sustainability projects.",link:"https://www.businesstoday.com.my/2026/07/29/air-selangor-prices-worlds-first-blue-sukuk-raises-rm200-million-for-sustainable-water-projects/",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:33,year:2026,region:'MY',cat:'G',title:"Bursa Malaysia hits top FTSE4Good ESG score of 5.0",source:"The Star / BusinessToday",date:"3 Jul 2026",summary:"Bursa Malaysia became the first Malaysian-listed company to achieve the highest possible score of 5.0 under the FTSE4Good ESG assessment framework, out of over 12,000 companies assessed worldwide.",why:"Sets a public benchmark for ESG leadership on the local exchange and raises expectations for other Malaysian PLCs.",link:"https://www.thestar.com.my/business/business-news/2026/07/03/bursa-malaysia-first-malaysian-plc-to-achieve-ftse4goods-highest-esg-score",impact:"Raises the bar for governance and disclosure benchmarking among Malaysian PLCs — relevant when positioning your own ESG performance to the board or investors."},
  {id:34,year:2026,region:'Global',cat:'E',title:"EU publishes first CBAM certificate price",source:"Flexport",date:"2026",summary:"The European Commission published the first official price for CBAM certificates, formalising the cost mechanism for carbon-intensive imports into the EU market.",why:"Direct cost exposure for Malaysian exporters of steel, aluminium and fertiliser into the EU, and a key input for carbon tax alignment strategy.",link:"https://www.flexport.com/blog/2026-cbam-update-eu-commission-published-the-first-cbam-certificate-price/",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:35,year:2026,region:'MY',cat:'E',title:"Malaysia carbon tax takes effect for iron, steel and energy sectors",source:"Government of Malaysia",date:"2026",summary:"Malaysia's carbon tax, announced in Budget 2025, came into effect targeting the iron, steel and energy sectors, aligned with national carbon market policy.",why:"Malaysia's first carbon pricing mechanism, setting the stage for broader sectoral coverage and CBAM reciprocity with the EU.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:36,year:2026,region:'MY',cat:'R',title:"All Main Market PLCs begin mandatory ISSB-aligned reporting",source:"Bursa Malaysia",date:"Jan 2026",summary:"The second wave of Malaysian PLCs (all remaining Main Market issuers) began mandatory sustainability reporting under IFRS S1 and S2, significantly expanding the NSRF's coverage.",why:"Broadens mandatory ESG disclosure from large-caps to the full Main Market, affecting hundreds more companies and their supply chains.",link:"",impact:"Adds to mandatory reporting scope and compliance timeline for Malaysian PLCs — relevant for reporting calendar, data collection systems and assurance planning."},
  {id:37,year:2026,region:'MY',cat:'E',title:"PETRONAS Activity Outlook 2026–2028 focuses on dual transition",source:"PETRONAS",date:"2026",summary:"PETRONAS published its 2026–2028 Activity Outlook, balancing energy security (~2 MMboe/d domestic production) with BIGST cluster decarbonisation and expanded speciality chemicals diversification.",why:"Shows Malaysia's largest company operationalising the dual mandate of energy security and net-zero transition simultaneously.",link:"",impact:"Directly affects capex planning, energy procurement and compliance costs for Malaysian operations — factor into sustainability budgets and board risk reporting."},
  {id:38,year:2026,region:'Global',cat:'R',title:"Japan confirms mandatory ISSB-aligned reporting from FY2027",source:"SSBJ / Japan FSA",date:"2026",summary:"Japan's Sustainability Standards Board finalised its first full sustainability disclosure framework, closely aligned with ISSB S1 and S2, mandatory for Prime Market firms above ¥3 trillion from FY2027.",why:"Another major economy committing to ISSB adoption, reinforcing the global convergence trajectory that Malaysia is part of.",link:"",impact:"Affects the global disclosure landscape multinational companies must navigate — relevant for group-level reporting strategy and cross-jurisdiction compliance."},

  // ===== US ANTI-ESG & CLIMATE POLICY =====
  {id:39,year:2022,region:'Global',cat:'G',title:"Florida divests $2 billion from BlackRock over ESG policies",source:"Reuters / Forbes",date:"Dec 2022",summary:"Florida announced it was pulling $2 billion from BlackRock's management, the largest anti-ESG divestment at the time, citing concerns that ESG investing could harm investor returns.",why:"Triggered a wave of US state-level anti-ESG actions, forcing asset managers to recalibrate how they communicate ESG strategies to politically divided stakeholders.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:40,year:2023,region:'Global',cat:'G',title:"US anti-ESG backlash peaks: 17 states pass anti-ESG legislation",source:"TD Securities / Harvard Business Review",date:"2023",summary:"At least 165 anti-ESG bills were introduced across 37 US states in H1 2023, with 17 states enacting anti-ESG laws restricting fund managers from considering ESG factors in public pension investments.",why:"Created a chilling effect on ESG-labelled investing in the US, with BlackRock and Vanguard reporting steep declines in support for ESG shareholder proposals.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:41,year:2023,region:'Global',cat:'G',title:"BlackRock loses $4 billion to anti-ESG boycotts but gains $230 billion overall",source:"Reuters / Davos 2023",date:"Jan 2023",summary:"BlackRock CEO Larry Fink confirmed at Davos that the firm lost ~$4 billion due to US anti-ESG state boycotts, but took in $230 billion from US clients overall in 2022, calling the attacks 'personal' and based on 'misconceptions'.",why:"Showed that anti-ESG was politically potent but financially limited — the business case for ESG-aware investing remained intact globally even as US rhetoric intensified.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},
  {id:42,year:2024,region:'Global',cat:'E',title:"Texas withdraws $8.5 billion from BlackRock over ESG",source:"Carbon Credits / Indiana Capital Chronicle",date:"2024",summary:"Texas State Board of Education pulled $8.5 billion from BlackRock, citing state legislation prohibiting investment in companies that boycott energy firms. Indiana followed with a ~$1 billion bond mandate exit.",why:"Escalated the dollar value of anti-ESG divestments, but studies estimated Texas could lose $6 billion in returns over 10 years from prohibiting ESG-integrated investing.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:43,year:2025,region:'Global',cat:'E',title:"Trump withdraws US from Paris Agreement for the second time",source:"NPR / ESG Dive",date:"20 Jan 2025",summary:"On his first day in office, President Trump signed an executive order withdrawing the US from the Paris Agreement, revoking 12 Biden-era climate executive orders, declaring a national energy emergency, and pausing new wind power permits on federal lands.",why:"The world's second-largest emitter formally exiting the Paris framework again, fragmenting global climate governance and creating strategic uncertainty for multinational companies including Malaysian exporters.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:44,year:2025,region:'Global',cat:'G',title:"BlackRock exits Net-Zero Asset Managers Initiative",source:"US Congress / Reuters",date:"Jan 2025",summary:"BlackRock, the world's largest asset manager, exited the UN-backed Net-Zero Asset Managers Initiative, a coalition of firms committed to net-zero emissions targets, amid sustained political pressure from US Republican lawmakers.",why:"Signalled a retreat from collective climate commitments by the world's largest investor, weakening the credibility of voluntary net-zero alliances globally.",link:"",impact:"Signals shifting investor and regulatory expectations globally — relevant when benchmarking governance practices or engaging with international investors."},

  // ===== SINGAPORE CARBON TAX =====
  {id:45,year:2022,region:'Global',cat:'E',title:"Singapore announces carbon tax escalation to S$50–80/tonne by 2030",source:"Singapore Budget 2022",date:"Feb 2022",summary:"Singapore's Finance Minister announced a five-fold increase in the carbon tax from S$5 to S$25/tonne in 2024, rising to S$45 in 2026 and targeting S$50–80 by 2030, making it ASEAN's most aggressive carbon pricing trajectory.",why:"Set the benchmark for ASEAN carbon pricing, putting pressure on Malaysia and other neighbours to develop comparable mechanisms to avoid competitive distortion.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:46,year:2024,region:'Global',cat:'E',title:"Singapore carbon tax rises to S$25/tonne; international carbon credits now eligible",source:"MSE Singapore",date:"Jan 2024",summary:"Singapore's carbon tax increased five-fold from S$5 to S$25/tonne, while allowing companies to offset up to 5% of taxable emissions using eligible international carbon credits for the first time.",why:"Made Singapore the first ASEAN country with both a meaningful carbon price and an international credits framework, creating a regional model for Malaysia's own carbon tax design.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
  {id:47,year:2026,region:'Global',cat:'E',title:"Singapore carbon tax rises to S$45/tonne",source:"MSE Singapore",date:"Jan 2026",summary:"Singapore's carbon tax increased to S$45/tonne from 1 January 2026, nearly doubling again from the S$25 rate in 2024–2025, on track to reach S$50–80/tonne by 2030.",why:"Widens the carbon pricing gap with Malaysia (which just introduced its first carbon tax in 2026), increasing competitive dynamics for energy-intensive industries across the Causeway.",link:"",impact:"Creates cost exposure or competitive dynamics for companies trading with or operating in the affected markets — relevant for supply chain and market entry strategy."},
